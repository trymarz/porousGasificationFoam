# Regression tiers in the pinned OpenFOAM v2606 image (#130; v2606 since #326).
# The image is openfoam-run:2606 plus openfoam2606-dev from ESI's apt repo.
# TODO(#326): FOAM_DEV_VERSION is release candidate 2606.0~rc2-1; switch it (and
# the one in container/pgf-toolchain.def) to the final package once ESI publishes it.
# fast: every PR to main and every push to main; convergence: nightly and on demand.
# build-yade: compile-only check of the DEM (WITH_YADE) variant on PRs and pushes.
# The dem tier stays local-only: the image has no Yade.
name: regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: pgf test tier to run
        type: choice
        options: [convergence, fast]
        default: convergence

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tier || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The image is pinned in one place: the From: line of container/pgf-toolchain.def.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.def.outputs.ref }}
    steps:
      - name: Check out the container recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: container
      - name: Read the image from pgf-toolchain.def
        id: def
        run: |
          set -eu
          ref="$(sed -n 's/^From:[[:space:]]*//p' container/pgf-toolchain.def)"
          [[ "$ref" =~ ^opencfd/openfoam-run@sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::pgf-toolchain.def From: is not a digest-pinned opencfd/openfoam-run image: '$ref'"; exit 1; }
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "image: $ref"

  regression:
    needs: image
    name: ${{ github.event_name == 'schedule' && 'convergence' || inputs.tier || 'fast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    env:
      TIER: ${{ github.event_name == 'schedule' && 'convergence' || inputs.tier || 'fast' }}
      PGF_FOAM_BASHRC: /usr/lib/openfoam/openfoam2606/etc/bashrc
      FOAM_DEV_VERSION: 2606.0~rc2-1  # rc2; see the TODO at the top
    defaults:
      run:
        shell: bash
    steps:
      - name: Install openfoam2606-dev, python3 and git
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y --no-install-recommends --allow-downgrades python3 git ca-certificates zstd \
            "openfoam2606-dev=$FOAM_DEV_VERSION"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pgf

      - name: Set work dirs
        run: |
          echo "PGF_BUILD_ROOT=$GITHUB_WORKSPACE/pgf-builds" >>"$GITHUB_ENV"
          echo "PGF_RUN_ROOT=$GITHUB_WORKSPACE/pgf-runs" >>"$GITHUB_ENV"
          # pgf test writes its record to $XDG_STATE_HOME/pgf/runs/last/<tier>.json.
          echo "XDG_STATE_HOME=$GITHUB_WORKSPACE/pgf-runs/state" >>"$GITHUB_ENV"

      - name: Toolchain
        working-directory: pgf
        run: |
          . /etc/os-release && echo "os:      $PRETTY_NAME"
          echo "gcc:     $(gcc -dumpfullversion)"
          echo "python3: $(python3 --version 2>&1)"
          echo "cores:   $(nproc)"

      - name: Build key
        id: key
        working-directory: pgf
        run: |
          set -eu
          key="$(./pgf exec --bare -- ./utilities/pgf/build.sh --print-key)"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "build key: $key"

      - name: Restore prefix
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgf-builds/${{ steps.key.outputs.key }}
          key: pgf-prefix-${{ steps.key.outputs.key }}

      # OpenFOAM refuses to compile coded boundary conditions as root,
      # so the build and the cases run as an unprivileged user.
      - name: Create test user
        run: |
          set -eu
          useradd --create-home pgf
          mkdir -p "$PGF_BUILD_ROOT" "$PGF_RUN_ROOT"
          chown -R pgf: "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: pgf
        run: |
          set -o pipefail
          runuser -u pgf -- ./pgf exec --bare -- ./utilities/pgf/build.sh --isolated 2>&1 |
            tee "$PGF_RUN_ROOT/ci-build.log" | tail -40

      - name: Save prefix
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgf-builds/${{ steps.key.outputs.key }}
          key: pgf-prefix-${{ steps.key.outputs.key }}

      - name: Run ${{ env.TIER }} tier
        working-directory: pgf
        run: runuser -u pgf -- ./pgf test "$TIER" --run-root "$PGF_RUN_ROOT/run"

      # Copy only regular files: kept case copies symlink back into the source tree.
      - name: Collect artifacts
        if: always()
        run: |
          set -u
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"
          cd "$PGF_RUN_ROOT" || exit 0
          for f in ci-build.log run/build.log run/driver.log "state/pgf/runs/last/$TIER.json"; do
            [ -f "$f" ] && cp --parents "$f" "$out/"
          done
          [ -d run/state ] && cp -r --parents run/state "$out/"
          if [ -d run/cases ]; then
            find run/cases \( -path '*/postProcessing/*' -o -name 'log.*' \) -type f \
              -exec cp --parents {} "$out/" \;
          fi
          [ -f run/state/result.json ] && python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({k: r[k] for k in r if k != "cases"}, indent=1))' run/state/result.json
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ env.TIER }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # Compile-only check of the DEM variant: build.sh --isolated --yade. The
  # pgfYadeCoupler needs only OpenFOAM and MPI, so Yade itself is not built,
  # the yade-pgf submodule is not checked out, and no DEM case runs.
  build-yade:
    needs: image
    if: github.event_name != 'schedule'
    name: build (yade)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user root
    env:
      PGF_FOAM_BASHRC: /usr/lib/openfoam/openfoam2606/etc/bashrc
      FOAM_DEV_VERSION: 2606.0~rc2-1  # rc2; see the TODO at the top
    defaults:
      run:
        shell: bash
    steps:
      - name: Install openfoam2606-dev, python3 and git
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y --no-install-recommends --allow-downgrades python3 git ca-certificates zstd \
            "openfoam2606-dev=$FOAM_DEV_VERSION"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pgf

      - name: Set work dirs
        run: |
          echo "PGF_BUILD_ROOT=$GITHUB_WORKSPACE/pgf-builds" >>"$GITHUB_ENV"
          echo "PGF_RUN_ROOT=$GITHUB_WORKSPACE/pgf-runs" >>"$GITHUB_ENV"

      # The build key hashes PGF sources only; nothing from Yade is linked.
      - name: Build key
        id: key
        working-directory: pgf
        run: |
          set -eu
          key="$(./pgf exec --bare -- ./utilities/pgf/build.sh --yade --print-key)"
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "build key: $key"

      - name: Restore prefix
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgf-builds/${{ steps.key.outputs.key }}
          key: pgf-prefix-${{ steps.key.outputs.key }}

      - name: Create build user
        run: |
          set -eu
          useradd --create-home pgf
          mkdir -p "$PGF_BUILD_ROOT" "$PGF_RUN_ROOT"
          chown -R pgf: "$GITHUB_WORKSPACE"

      - name: Build PGF with Yade
        working-directory: pgf
        run: |
          set -o pipefail
          runuser -u pgf -- ./pgf exec --bare -- ./utilities/pgf/build.sh --isolated --yade 2>&1 |
            tee "$PGF_RUN_ROOT/ci-build.log" | tail -40

      - name: Check the coupling was built and linked
        working-directory: pgf
        run: |
          set -eu
          prefix="$PGF_BUILD_ROOT/${{ steps.key.outputs.key }}"
          for f in lib/liblambdaDotModel.so bin/porousGasificationFoam; do
            [ -s "$prefix/$f" ] || { echo "::error::missing $prefix/$f"; exit 1; }
          done
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["variant"]; print("variant:", v); sys.exit(v != "yade1")' \
            "$prefix/.pgf-build.json"
          runuser -u pgf -- ./pgf exec --prefix "$prefix" -- \
            bash -c 'ldd "$(command -v porousGasificationFoam)"' >"$PGF_RUN_ROOT/ldd.txt"
          ! grep 'not found' "$PGF_RUN_ROOT/ldd.txt"
          grep -q "liblambdaDotModel\.so => $prefix/lib/" "$PGF_RUN_ROOT/ldd.txt" ||
            { echo "::error::porousGasificationFoam does not link liblambdaDotModel from the prefix"; exit 1; }
          ! grep -E 'lib(YadeFoam|MeshTree|YadeComm)\.so' "$PGF_RUN_ROOT/ldd.txt" ||
            { echo "::error::porousGasificationFoam still links a legacy FoamYade coupling lib (dropped in #326)"; exit 1; }

      - name: Save prefix
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgf-builds/${{ steps.key.outputs.key }}
          key: pgf-prefix-${{ steps.key.outputs.key }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-yade-${{ github.run_id }}-${{ github.run_attempt }}
          path: pgf-runs/*.*
          if-no-files-found: warn
          retention-days: 14
