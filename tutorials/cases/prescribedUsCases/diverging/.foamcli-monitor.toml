[heatmap]
fields = ["T", "Ts", "porosityF", "Ychar"]

[slice]
axis = "z"
position = 0.0005

[render]

[[render.slice]]
axis = "z"
position = 0.0005
fields = ["T"]
output = "render/snapshots/postrun/{field}_{axis}{position}.png"

[snapshots]
enabled = true
automatic = true
directory = "render/snapshots"
stride = 1
fields = ["T"]
