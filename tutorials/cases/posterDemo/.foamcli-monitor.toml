[heatmap]
# Solid-phase fields: bed structure, temperatures, fuel/char conversion.
# DEM coupling: particle count, reaction rate, porosity fraction.
fields = [
    "porosityF", "Ts", "T", "p",
    "Ywood", "Ychar", "Ydefault",
    "nParticles", "lambdaDot", "alpha",
]

[probes]
# 7 centreline probes matching the centerlineProbes function object in
# controlDict (z along the column axis from z = 0.03 to z = 0.21 m).
labels = ["z=3cm", "z=6cm", "z=9cm", "z=12cm", "z=15cm", "z=18cm", "z=21cm"]

[monitor]
refresh_interval = 2.0
panels = ["progress", "probes", "heatmap"]

[slice]
# 4×4×8 genuinely 3D mesh (128 cells).  Slice at the mid-y plane (y = 0.02,
# matching the midPlane cutting plane in controlDict) so the heatmap renders
# as a 2D xz-slice through the column.
axis = "y"
position = 0.02
