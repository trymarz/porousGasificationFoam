# tiers.conf: the test tiers pgf-test runs, one pgf_tier row per tier.
# Bash-sourceable; pgf-test defines pgf_tier before sourcing it. "-" means empty.
#   runner     driver under applications/test/regression
#   variant    yade0 | yade1 (build.sh --isolated [--yade])
#   jobs       --jobs for the driver
#   timeout    seconds, exported as YADE_TIMEOUT (DEM driver only)
#   env        extra pgf-env flags, e.g. "--yade --mpi loopback"
#   selection  driver arguments choosing the cases
#   cadence    when to run it (informational; pgf-test --if-stale enforces age)
#
#        tier         runner       variant jobs timeout env                     selection            cadence
pgf_tier fast         Allrun       yade0   4    -       -                       "--tag fast"         "every push"
pgf_tier convergence  Allrun       yade0   2    -       -                       "--tag convergence"  "nightly or --if-stale 7d"
pgf_tier dem          Allrun.yade  yade1   1    -       "--yade --mpi loopback" -                    "before DEM-touching merges"
